# PR 高速検査(M24-09a / D-480)。
# 目的(nightly-crossbuild.yml とは目的が違う):
#   PR ごとに回る高速検査。DORA の「上限約 10 分」に収める(ベースライン計測 §2)。
#   3 OS クロスビルドは本ワークフローの担当ではない ⇒ nightly-crossbuild.yml。
#
# 受入条件: time-to-green 10 分以内のみ。
#   ★5 分は目標に置かない。ベースライン計測 §6 が「5 分は未達の見込み」と記録しており、
#   達成できない数字を受入条件に置くと以後の判断が「未達のまま」で固定される(D-480 / §11-3)。

name: PR checks

# 推測: 既定ブランチ名を main と仮定した(実査: api.github.com の default_branch = main)。
# 推測: workflow_dispatch は指示書 §4.1-1 の指定(PR + 既定ブランチへの push)に無いが、
#       開発者が PR を開かずに初回の緑を確認できるようにするため足した。
#       ★ただし workflow_dispatch は「既定ブランチに在るファイル」しか Actions UI に現れない。
#         本ファイルが main へ入るまで手動起動は選べない(README「初回の受入確認」参照)。
#
# ★paths / paths-ignore フィルタは意図して入れていない(検討した上で入れない判断)。
#   このリポジトリは docs 変更の比率が高く(直近 20 コミット中 16 本が docs:)、
#   docs のみの PR で go test と Vitest が回るのは分数の無駄ではある。
#   それでも入れないのは、**フィルタで skip された job は必須 check として
#   「pending のまま」になり PR がマージできなくなる**ため。フィルタを掛けない薄い job で
#   必須 check の受け皿を作る形が要るが、それは必須 check を実際に登録してから決めるべきで、
#   未登録の今入れると壊れ方だけが増える。⇒ 必須 check 登録後に再検討する。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 推測: 同一 ref の古い実行は打ち切る。private リポジトリのため Actions 分数を節約する。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────
  # job 分割の理由(ベースライン計測 §4 A0-2):
  #   go test が総コストの支配項(2 コア相当で 245.6 秒)であり、vet/build は小さい
  #   (冷 GOCACHE の go vet が 10.8 秒 / build 10 秒)。分けて並列に走らせることで
  #   ウォールクロックが go test の長さへ寄る。直列にすると単純に足し算になる。
  #
  # ★キャッシュを保存するのは go-test job だけにしてある(下の restore / cache の使い分け)。
  #   2 job が同じ key で保存しようとすると、並列実行では片方が
  #   「別の job が同じキーで作成中」で保存をスキップする。約 228MB を無駄に奪い合わせない。
  # ────────────────────────────────────────────────────────────────
  go-vet-build:
    name: go vet + go build
    runs-on: ubuntu-latest
    # 受入条件が 10 分以内であること、および private リポジトリの分数を守るため
    # 既定の 360 分を使わない。ハングしたら 6 時間分溶ける。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # setup-go 内蔵のキャッシュは切る。下の actions/cache で hit/miss を
          # 明示的に読み取り、job summary へ残すため(§4.1-5)。
          cache: false

      # 推測: キャッシュキーは go.sum のハッシュで作った。go.sum が動かない限り
      #       同じキャッシュを再利用する。restore-keys で前方一致の部分ヒットも拾う。
      # ★本 job は restore 専用(保存は go-test 側)。
      - name: Restore Go build cache
        id: gocache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: go vet
        run: go vet ./...

      # ═══════════════════════════════════════════════════════════════
      # ★ gofmt は「出力が空かどうか」で判定すること。終了コードでは判定できない。
      #
      #   `gofmt -l` は非適合ファイルを列挙しても **exit 0 で終わる**。
      #   `run: gofmt -l ./...` と書くと、崩れていても job は緑のまま通る。
      #   ⇒ 出力を変数へ取り、非空なら明示的に落とす。
      #     これは同ファイル :157 の -count=1 や pipefail と同じ型の罠である
      #     (DES-002 §11.3 の契約 1・2 =「終了コードでは区別できない」)。
      #
      # ★出所: followup `gofmt-not-in-pr-checks` / M24-08 第 2 部 D。
      #   M24-07 が internal/api/combo/dto.go を崩したとき、レビューも go vet も
      #   go test も検出できなかった。go vet は書式を見ない。
      #   ⇒ 「守るべきものはあるが PR で観測されていない」型であり、
      #     CSV 列名の契約(M24-07)と同じ穴だった。
      #
      # ★着手時の検出は 1 件のみ(internal/infra/migration/migrate_m2402_test.go・
      #   M24-02 由来)であり、母数が 1 なのでベースライン固定型は採らず先に是正した。
      # ═══════════════════════════════════════════════════════════════
      - name: gofmt
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::gofmt に非適合のファイルがあります。gofmt -w 相当の整形が要ります:"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "gofmt: 非適合 0 件"

      # embed_web タグは付けない。付けると //go:embed all:web/dist が web/dist を要求し、
      # フロントをビルドしていない本 job では失敗する(embed_web_stub.go / _release.go)。
      # 埋め込み済みバイナリの生成は nightly-crossbuild.yml の担当。
      - name: go build
        run: go build ./...

      # ═══════════════════════════════════════════════════════════════
      # ★ Windows 専用コードは、この 1 ステップが無いと PR で 1 度も
      #   コンパイルされない(M34-01)。
      #
      #   本 job の go vet / go build / go test はすべて ubuntu-latest・タグ無しで
      #   走るため、`//go:build windows` の付いたファイル
      #   (internal/desktop/*_windows.go)は **存在しないのと同じに見える。**
      #   タグの掛け違いも Win32 呼び出しの打ち間違いも、Linux 側は何も言わない。
      #
      #   ⇒ 実測(2026-09-09): tray_sizes_windows_amd64.go の構造体サイズガードを
      #     わざと崩したところ、`go build ./...` は **緑のまま通った**。
      #     捕まえられたのは GOOS=windows のコンパイルだけだった。
      #
      # ★従来これを拾えたのは nightly-crossbuild.yml の make build-all だけで、
      #   検出が最大 1 日遅れていた。本ステップはフロントを要求しないので数秒で済む。
      #
      # ★正本は Makefile の check-windows。フラグをワークフローへ直書きしない
      #   (nightly-crossbuild.yml が make build-all を呼ぶのと同じ方針)。
      # ═══════════════════════════════════════════════════════════════
      - name: go build / vet (GOOS=windows)
        run: make check-windows

      - name: Job summary
        if: always()
        run: |
          {
            echo "### go vet + go build"
            echo ""
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| 所要 | $(( $(date +%s) - JOB_START )) 秒 |"
            echo "| ランナー実コア数 | $(nproc) |"
            echo "| Go | $(go version) |"
            # ★cache は高速化であって正しさの根拠にしない(ベースライン A0-3)。
            #   hit/miss は「速かった理由」を説明するためだけに残す。
            #   ★cache-hit は key の完全一致でのみ true になる。restore-keys による
            #     部分ヒットでも false になるため、2 値だと「復元されているのに miss」と出て
            #     所要秒の原因分析を誤らせる。matched-key を併記して 3 値にする。
            echo "| Go cache | ${{ steps.gocache.outputs.cache-hit == 'true' && '完全一致' || (steps.gocache.outputs.cache-matched-key != '' && '部分一致' || 'miss') }} |"
            echo "| matched key | \`${{ steps.gocache.outputs.cache-matched-key || '(なし)' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  go-test:
    name: go test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # ★保存も行うのは本 job だけ(go-vet-build は restore 専用)。
      - name: Restore and save Go build cache
        id: gocache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      # ═══════════════════════════════════════════════════════════════
      # ★ -count=1 は絶対に外さないこと。本ワークフローで最も重要な 1 行である。
      #
      #   外すと Go のテスト結果キャッシュが効き、「実行していないのに緑」になる。
      #   実測(2026-08-20 / 4 コア環境):
      #     go test -count=1 ./...  → 142.2 秒 / (cached) 0 パッケージ
      #     go test ./...           →   0.385 秒 / (cached) 53/53 パッケージ / exit 0
      #   369 倍の差であり、exit code は両方 0。**終了コードでは区別できない。**
      #   ベースライン計測でも 1 回目の計測が 46/46 cached で無効になっている(§1.1 / A0-4)。
      #
      #   ★Makefile の test-go は -count=1 を欠く(Makefile:63)。だから make は呼ばない。
      # ═══════════════════════════════════════════════════════════════
      #
      # 出力をファイルへ残して件数を job summary へ写す(教訓 E-125)。
      # 「件数が書かれていない報告は、そのテストが 1 件も走っていない可能性を排除できない」。
      # 所要秒だけだと、人が所要を見て気づくことに依存する。
      # tee でパイプするため pipefail が要る。GitHub の実ランナーでは既定シェルが
      # `bash -e` で起動し、意図的失敗を tee の exit 0 が覆い隠したため明示する。
      - name: go test
        run: |
          set -o pipefail
          go test -count=1 ./... 2>&1 | tee go-test.log

      - name: Job summary
        if: always()
        run: |
          {
            echo "### go test"
            echo ""
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| コマンド | \`go test -count=1 ./...\` |"
            echo "| 所要 | $(( $(date +%s) - JOB_START )) 秒 |"
            if [ -f go-test.log ]; then
              echo "| ok パッケージ | $(grep -c '^ok' go-test.log) |"
              echo "| FAIL パッケージ | $(grep -c '^FAIL' go-test.log) |"
              echo "| no test files | $(grep -c 'no test files' go-test.log) |"
              echo "| **(cached) パッケージ** | **$(grep -c '(cached)' go-test.log)** |"
            else
              echo "| 件数 | ログ不在(テスト到達前に失敗) |"
            fi
            echo "| ランナー実コア数 | $(nproc) |"
            echo "| Go cache | ${{ steps.gocache.outputs.cache-hit == 'true' && '完全一致' || (steps.gocache.outputs.cache-matched-key != '' && '部分一致' || 'miss') }} |"
            echo ""
            echo "> **(cached) が 0 でなければ \`-count=1\` が効いていない。** 所要が数秒なら実行されていない。"
          } >> "$GITHUB_STEP_SUMMARY"

  web-test:
    name: web test (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      # パッケージマネージャは pnpm 固定(CLAUDE.md §11)。npm / yarn / npx は使わない。
      # version は指定しない ⇒ action-setup が web/package.json の packageManager
      # ("pnpm@9.13.0") を読む。ここに版数を書くと二重管理になり必ずずれる。
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      # 推測: Node は devContainer と揃えて 22 とした(README「必要環境」は 20 以上)。
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # --frozen-lockfile: pnpm-lock.yaml に差分を出さない。
      # ロックとずれていれば install 自体が落ちる ⇒ 依存の無断変更を検知できる。
      - name: pnpm install
        working-directory: web
        run: |
          START=$(date +%s)
          pnpm install --frozen-lockfile
          echo "PNPM_INSTALL_SEC=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"

      # vitest は既定が watch モードのため --run が要る(Makefile test-web と同じ形)。
      # 件数を summary へ写すためログを残す(E-125。go test 側と同じ理由)。
      # tee でパイプするため pipefail が要る(DES-002 §11.3 の契約 2)。
      # ★着手前は本 step にだけ pipefail が無く、契約 2 が名指しで禁じた形が
      #   残っていた(go test 側 :157 と nightly の E2E には入っている)。
      #   実測(M24-08・同一セッション): 赤い vitest を `| tee` へ流すと
      #     pipefail なし → exit 0（job は緑のまま通る）
      #     pipefail あり → exit 1
      #   ⇒ 体裁ではなく、Vitest の失敗が PR を止めていなかった。
      - name: pnpm test
        working-directory: web
        run: |
          set -o pipefail
          pnpm test -- --run 2>&1 | tee vitest.log

      # ★★ログから件数を抜くときは、先に ANSI エスケープを落とすこと(M24-08 後日是正)。
      #   Vitest は色付けの判定に picocolors を使い、**TTY でなくても CI=true なら色を付ける**。
      #   GitHub Actions は CI=true を必ず立てるため、tee したログの行頭は空白ではなく
      #   エスケープになる。実測(2026-08-31):
      #     ^[[2m Test Files ^[[22m ^[[1m^[[32m210 passed^[[39m...
      #   ⇒ 行頭アンカー(`^[[:space:]]*Test Files`)は 1 件も当たらない。
      #
      # ★着手前は「当たらない」が**空欄**として出ていた。job は緑・他の行は埋まるため、
      #   壊れていることが読めなかった(2026-08-31 の手動起動で開発者が発見)。
      #   ⇒ 空のときは行なしと分かる印を出す。nightly-crossbuild.yml の E2E summary が
      #     既にその形(`**行が無い(読めなかった)**`)を持っており、そちらへ揃えた。
      #   ★同 E2E summary は `grep -oE '[0-9]+ passed'` で**行頭を見ない**ため無傷である。
      #     壊れていたのは本 step だけである。
      - name: Job summary
        if: always()
        run: |
          TEST_FILES=""; TESTS=""
          if [ -f web/vitest.log ]; then
            STRIPPED=$(sed 's/\x1b\[[0-9;]*m//g' web/vitest.log)
            TEST_FILES=$(printf '%s\n' "$STRIPPED" | grep -E '^[[:space:]]*Test Files' | tail -1 | sed 's/^[[:space:]]*Test Files[[:space:]]*//' || true)
            TESTS=$(printf '%s\n' "$STRIPPED" | grep -E '^[[:space:]]*Tests' | tail -1 | sed 's/^[[:space:]]*Tests[[:space:]]*//' || true)
          fi
          {
            echo "### web test (Vitest)"
            echo ""
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| 所要(job 全体) | $(( $(date +%s) - JOB_START )) 秒 |"
            echo "| うち pnpm install | ${PNPM_INSTALL_SEC:-計測前に失敗} 秒 |"
            if [ -f web/vitest.log ]; then
              echo "| Test Files | ${TEST_FILES:-**行が無い(読めなかった)**} |"
              echo "| Tests | ${TESTS:-**行が無い(読めなかった)**} |"
            else
              echo "| 件数 | **ログ不在(テスト到達前に失敗)** |"
            fi
            echo "| ランナー実コア数 | $(nproc) |"
            echo "| pnpm | $(pnpm -v) |"
            echo ""
            echo "> **件数が出ていなければ、スイートが 1 件も走っていない可能性を排除できない。**"
          } >> "$GITHUB_STEP_SUMMARY"

  # E2E(Playwright)は本ワークフローには載せない。指示書 §1.3-1。
  #
  # ★★載せない理由は M24-09d(2026-08-30)で差し替わった。旧理由をそのまま残さないこと。
  #   旧: 「web/playwright.config.ts が CI 向けの 3 点(workers: 1 / reporter: dot /
  #        retry の扱い)を未適用であり、Track B の開始条件(1 worker 連続成功)も未達」
  #        (ベースライン計測 §1.5 / A0-6)
  #   ★このうち workers: 1 は M24-09c / CHANGE-135 で適用済みであり、旧理由は失効した。
  #
  #   現在の理由: workers: 1 のため 4〜5 分かかる。**PR ごとに 4〜5 分を足すかは
  #     受入条件(time-to-green 10 分以内)に関わる別の判断である**(M24-09d §1.6-6)。
  #
  # ⇒ ★★E2E は nightly-crossbuild.yml の e2e job が回す(M24-09d / D-594)。
  #   **main の E2E が緑かを観測する経路はそちらに在る。** ここに無いことを
  #   「どこにも無い」と読まないこと。
  #
  #   ★「とりあえず載せて retries で緑にする」はしない —— retry を既知のアプリ欠陥を
  #     隠すために使わない。
  #
  # クロスビルドも載せない。nightly-crossbuild.yml の担当(指示書 §4.1-8)。
